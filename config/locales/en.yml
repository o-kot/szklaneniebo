  about:
    text: "My fascination with stained glass has always been within me.\n\nIt's not just an image - it's a living story of light... it changes with the time of day, with the weather, with the mood. It's never the same. Light dancing to sunny music.\n\nStained glass teaches me humility before matter, which is both fragile and unyielding.\n\nGlass - cold, yet warmed by the sun. Hard, yet prone to breaking. It doesn't allow haste. It demands presence. Being in the here and now.\n\nFor me, creation is a dialogue. Between light and color. Between silence and form. Between what's internal and what's visible.\n\nIn a world of rush, I choose ... unhurriedness.\n\nIn a world of excess - simplicity.\n\nIn a world of noise - silence and light.\n\nThis is my path ...\n\nMy stained glass hobby has been going on for several years, I work in the Tiffany technique.\n\nMy works are found in many homes, both in Poland and abroad.\n\nCONTACT - alicja-631@wp.pl\n\nThank you for visiting my website..."
